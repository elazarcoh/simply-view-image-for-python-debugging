# Dependabot configuration
#
# Goal: a small, predictable number of grouped PRs (roughly 2-3 on the 1st of
# each month), instead of one PR per dependency. Security updates are grouped
# too, so an advisory burst arrives as a single PR per ecosystem.
#
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # ── npm / yarn 4 ────────────────────────────────────────────────────────────
  # The root manifest also covers the `icons` workspace member (the `workspaces`
  # field in package.json), so no separate entry is needed for it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly # runs on the 1st of the month
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore # -> chore(deps): / chore(deps-dev):
      include: scope
    labels: [dependencies, javascript]
    cooldown:
      # Let releases settle before picking them up, so we don't chase
      # same-week regressions.
      default-days: 7
      semver-major-days: 30
    groups:
      npm-runtime:
        # Ships inside the .vsix - the group that actually needs review.
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      npm-tooling:
        # Build / lint / test only. Safe to merge on green CI.
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # These are consumed through yarn's `patch:` protocol
      # (.yarn/patches/*.patch). A version bump silently invalidates the patch
      # and breaks `yarn install --immutable`.
      - dependency-name: vscode-extension-tester
      - dependency-name: '@wasm-tool/wasm-pack-plugin'
      # @types/vscode must stay <= engines.vscode (^1.63.0). Even a minor bump
      # raises the minimum VS Code version the extension claims to support.
      - dependency-name: '@types/vscode'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # Pinned deliberately.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, github-actions]
    cooldown:
      # Only `default-days` is supported for the github-actions ecosystem;
      # the semver-* variants are rejected at config-validation time.
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  # ── Rust / wasm webview ─────────────────────────────────────────────────────
  # Patch-only on purpose: nearly every crate here is 0.x (yew 0.21, image 0.24,
  # ndarray 0.15, strum 0.25, ...), where a "minor" bump is a breaking change,
  # and there is no committed Cargo.lock to catch drift.
  - package-ecosystem: cargo
    directories:
      - /src/webview-ui
      - /src/webview-ui/shaders
    schedule:
      interval: quarterly
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, rust]
    cooldown:
      default-days: 14
    groups:
      cargo-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch]
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # `groups.update-types` above only controls how updates are *bundled*, not
      # whether Dependabot opens a PR at all - anything outside a group still
      # arrives as its own PR. Without this, `strum = "0.25"` -> "0.28" showed up
      # individually (#266), which is exactly what patch-only was meant to avoid.
      #
      # Trade-off: `ignore` suppresses security updates too, so a Rust advisory
      # that needs a minor bump will show as an alert in the Security tab with no
      # PR attached. Deliberate - these crates are all 0.x, where a minor bump is
      # a breaking change, and there is no Cargo.lock to pin what resolved.
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  # ── icons workspace member ──────────────────────────────────────────────────
  # `icons` is a yarn workspace member with no lockfile of its own, so a
  # directory-scoped update edits icons/package.json and leaves the root
  # yarn.lock untouched - which `yarn install --immutable` rejects outright
  # (YN0028), as seen in #267. The root `/` entry above already updates these
  # dependencies correctly through the workspace (svgo 2.8.3 arrived that way in
  # #270), so this entry exists only to suppress the duplicate.
  - package-ecosystem: npm
    directory: /icons
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'

  # ── example-plugin ──────────────────────────────────────────────────────────
  # Unlike `icons`, this one has its own yarn.lock, so directory-scoped updates
  # here resolve cleanly.
  # Demo code with its own yarn.lock and no CI. No version updates (limit 0),
  # but keep security fixes flowing as a single grouped PR.
  - package-ecosystem: npm
    directory: /example-plugin
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, example-plugin]
    groups:
      example-plugin-security:
        applies-to: security-updates
        patterns: ['*']

  # NOTE: tests/unit/python/requirements.txt and
  # tests/test-data/workspace/requirements.txt are intentionally NOT configured.
  # They are unpinned (pytest / numpy / matplotlib / Pillow), so there are no
  # version constraints for Dependabot to update.
